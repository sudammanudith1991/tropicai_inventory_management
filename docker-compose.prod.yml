version: '3.8'
# This file is used on the EC2 instance in production.
# Images are pulled from GitHub Container Registry (GHCR).

services:
  backend:
    image: ghcr.io/sudammanudith1991/tropicai_inventory_management/backend:latest
    container_name: tropicai-api
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: 86400000
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    restart: unless-stopped

  frontend:
    image: ghcr.io/sudammanudith1991/tropicai_inventory_management/frontend:latest
    container_name: tropicai-web
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
