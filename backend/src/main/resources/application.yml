spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tropicai}
    username: ${SPRING_DATASOURCE_USERNAME:tropicai}
    password: ${SPRING_DATASOURCE_PASSWORD:tropicai_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:changeme_use_a_long_random_string_in_production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  aws:
    s3-bucket: ${AWS_S3_BUCKET:tropicai-files}
    region: ${AWS_REGION:ap-south-1}

logging:
  level:
    com.tropicai: INFO
    org.springframework.security: WARN
