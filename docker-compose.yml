version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tropicai-db
    environment:
      POSTGRES_DB: ${DB_NAME:-tropicai}
      POSTGRES_USER: ${DB_USER:-tropicai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tropicai_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tropicai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tropicai-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-tropicai}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-tropicai}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-tropicai_secret}
      JWT_SECRET: ${JWT_SECRET:-changeme_use_a_long_random_string_in_production}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-tropicai-files}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: tropicai-web
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
